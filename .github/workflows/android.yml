name: Build 3S Verse POS Android APK
on:
  push:
  workflow_dispatch: {}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        working-directory: android-apk
        run: npm install
      - name: Add Android platform
        working-directory: android-apk
        run: npx --yes cap add android
      - name: Add camera permission
        working-directory: android-apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$M"
      - name: Build APK
        working-directory: android-apk/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        working-directory: android-apk/android
        run: cp app/build/outputs/apk/debug/app-debug.apk 3SVerse-POS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 3SVerse-POS-Android-APK
          path: android-apk/android/3SVerse-POS.apk
