name: Build 3S Verse POS Windows EXE
on:
  push:
  workflow_dispatch: {}
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist -- --publish never
        env:
          GH_TOKEN: ""
      - uses: actions/upload-artifact@v4
        with:
          name: 3SVerse-POS-Windows-EXE
          path: dist/*.exe
