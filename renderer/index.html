<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3S Verse POS System</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--line:#334155;--txt:#e2e8f0;--muted:#94a3b8;--accent:#22c55e;--accent2:#16a34a;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--radius:12px;--shadow:0 6px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:8px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.app{display:flex;height:100vh}
.sidebar{width:82px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;border-right:1px solid var(--line);overflow:auto}
.logo{font-weight:800;font-size:18px;color:var(--accent);margin-bottom:10px;text-align:center;line-height:1}
.logo small{display:block;font-size:8px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-top:2px}
.navbtn{width:66px;height:50px;border-radius:11px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;transition:.15s;position:relative}
.navbtn svg{width:20px;height:20px}.navbtn:hover{background:var(--panel)}
.navbtn.active{background:var(--accent);color:#fff;font-weight:700}
.navbtn .badge{position:absolute;top:4px;right:8px;background:var(--red);color:#fff;border-radius:10px;font-size:9px;padding:0 5px;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--panel);display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:17px;font-weight:700}.topbar .spacer{flex:1}
.pill{background:var(--panel2);padding:6px 12px;border-radius:20px;font-size:12px;color:var(--muted)}
.pill.sync{cursor:pointer}.pill.sync.ok{color:var(--accent)}
.iconbtn{background:var(--panel2);color:var(--txt);width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.userchip{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:5px 10px;border-radius:20px;font-size:12px;color:var(--txt)}
.userchip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.view{flex:1;overflow:auto;padding:18px}.hidden{display:none!important}
.footer{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}
.footer b{color:var(--accent);font-weight:700;margin:0 4px}
.pos{display:grid;grid-template-columns:1fr 420px;gap:16px;height:100%}
.pos-left{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.searchrow{display:flex;gap:10px;align-items:center}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{padding:7px 14px;border-radius:20px;background:var(--panel2);color:var(--muted);font-size:13px;border:1px solid var(--line)}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;align-content:start;padding-right:4px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card .name{font-weight:600;font-size:13px;line-height:1.25;min-height:32px}
.card .price{color:var(--accent);font-weight:700;font-size:15px}
.card .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.card .stockbadge{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 6px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.card .stockbadge.low{background:#7c2d12;color:#fdba74}.card .stockbadge.out{background:#7f1d1d;color:#fca5a5}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.cart-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.cart-head b{font-size:15px}
.cart-items{flex:1;overflow:auto;padding:8px}
.citem{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.citem:hover{background:var(--panel2)}
.citem .ci-name{flex:1;font-size:13px}.citem .ci-name small{display:block;color:var(--muted);font-size:11px}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:24px;height:24px;border-radius:6px;background:var(--panel2);color:var(--txt);font-size:15px;line-height:1}.qty input{width:38px;text-align:center;padding:4px}
.ci-total{width:74px;text-align:right;font-weight:600;font-size:13px}.ci-del{color:var(--red);background:none;font-size:16px;padding:2px 6px}
.cart-foot{border-top:1px solid var(--line);padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.totrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.totrow.grand{font-size:21px;color:var(--txt);font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.btnrow{display:flex;gap:8px}
.btn{padding:11px;border-radius:9px;font-weight:600;font-size:14px;flex:1;transition:.12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--panel2);color:var(--txt)}.btn-blue{background:var(--blue);color:#fff}.btn-amber{background:var(--amber);color:#241a02}.btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 200px)}
.tag{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600}
.tag.green{background:#14532d;color:#86efac}.tag.amber{background:#78350f;color:#fcd34d}.tag.red{background:#7f1d1d;color:#fca5a5}.tag.blue{background:#1e3a8a;color:#93c5fd}.tag.gray{background:var(--panel2);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:26px;font-weight:800;margin-top:6px}.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat .ico{float:right;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}.toolbar .spacer{flex:1}
.barbtn{padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;background:var(--panel2);color:var(--txt);display:inline-flex;align-items:center;gap:6px}
.barbtn.green{background:var(--accent);color:#fff}.barbtn.blue{background:var(--blue);color:#fff}.barbtn.red{background:var(--red);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{font-size:17px;flex:1}.modal-head .x{background:none;color:var(--muted);font-size:22px}
.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);color:var(--txt);padding:12px 22px;border-radius:30px;z-index:600;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}#toast.err{border-color:var(--red)}
.pay-methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.pay-opt{padding:14px 8px;border-radius:10px;background:var(--panel2);border:2px solid transparent;text-align:center;font-size:12px;font-weight:600}
.pay-opt.active{border-color:var(--accent)}
.numbig{font-size:32px;font-weight:800;text-align:right;padding:8px 0}.change-amt{font-size:22px;font-weight:800;color:var(--accent)}
.help{font-size:11px;color:var(--muted);margin-top:4px}
.biztype{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.biztype .bt{padding:16px 12px;border-radius:11px;background:var(--panel2);border:2px solid transparent;text-align:center;font-weight:600;font-size:13px}
.biztype .bt.active{border-color:var(--accent)}.biztype .bt .e{font-size:24px;display:block;margin-bottom:6px}
.kbd{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-family:monospace}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.themecard{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.themecard.active{border-color:var(--accent)}
.themecard .prev{height:46px;border-radius:8px;display:flex;align-items:flex-end;padding:6px;gap:4px;margin-bottom:8px}
.themecard .chip{width:20px;height:20px;border-radius:5px}
.login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#0b1220,#1e293b);display:flex;align-items:center;justify-content:center;z-index:500}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;width:380px;max-height:94vh;overflow:auto;box-shadow:var(--shadow)}
.login-card h2{font-size:21px;margin-bottom:2px}.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.login-logo{max-height:60px;margin:0 auto 12px;display:block}
.scanbox{background:var(--panel);border:2px dashed var(--accent);border-radius:14px;padding:30px;text-align:center;margin-bottom:16px}
@media (max-width:820px){
  body{font-size:13px}
  .app{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:6px;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{display:none}
  .navbtn{width:62px;min-width:62px;height:48px;font-size:9px}
  .footer{display:none}
  .topbar{flex-wrap:wrap;height:auto;min-height:48px;padding:6px 10px;gap:6px}
  .topbar h2{font-size:15px;flex-basis:100%}
  .pill,.iconbtn,.userchip{font-size:11px}
  .view{padding:10px}
  .pos{display:flex;flex-direction:column;height:auto}
  .pos-left{overflow:visible}
  .searchrow{flex-wrap:wrap}
  .searchrow input{min-width:58%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));max-height:none;overflow:visible}
  .cart{order:2;margin-top:12px}
  .cart-items{max-height:280px}
  .row2,.row3{grid-template-columns:1fr}
  .modal{max-width:100%}
  .tablewrap{max-height:none}
}
@media print{@page{size:80mm auto;margin:0}html,body{width:80mm;background:#fff!important}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:80mm}.no-print{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo"><img src="assets/icon-512.png" alt="" style="width:30px;height:30px;border-radius:7px;vertical-align:-8px;margin-right:7px">3S<small>VERSE POS</small></div>
    <button class="navbtn active" data-view="pos" onclick="nav('pos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>Sale</button>
    <button class="navbtn" data-view="dashboard" onclick="nav('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Stats</button>
    <button class="navbtn" data-view="products" onclick="nav('products')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg><span id="navItems">Items</span></button>
    
    <button class="navbtn" data-view="requests" id="nav-requests" onclick="nav('requests')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Requests</button>
    <button class="navbtn" data-view="customers" onclick="nav('customers')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Customers</button>
    <button class="navbtn" data-view="users" onclick="nav('users')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><circle cx="12" cy="10" r="2.2"/><path d="M8.5 16a3.5 3.5 0 0 1 7 0"/></svg>Users</button>
    <button class="navbtn" data-view="sales" onclick="nav('sales')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>Sales</button>
    <button class="navbtn" data-view="reports" onclick="nav('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>Reports</button>
    <button class="navbtn" data-view="display" onclick="nav('display')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H16a6 6 0 0 0 6-6c0-4.4-4.5-8-10-8z"/></svg>Display</button>
    <button class="navbtn" data-view="settings" onclick="nav('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Setup</button>
  </div>
  <div class="main">
    <div class="topbar"><h2 id="viewTitle">New Sale</h2><span class="spacer"></span><span class="pill" id="clock"></span><button class="iconbtn" id="themeBtn" title="Toggle light/dark" onclick="toggleTheme()">🌙</button><span class="pill sync" id="syncPill" onclick="nav('settings')" title="Cloud sync">☁️ Cloud</span><span class="userchip" id="userChip" style="display:none"></span><button class="barbtn" id="logoutBtn" style="display:none;padding:6px 12px" onclick="logout()">Logout</button><span class="pill" id="storePill">Store</span></div>
    <div class="view" id="view-pos">
      <div class="pos">
        <div class="pos-left">
          <div class="searchrow">
            <input id="search" placeholder="🔍 Search or scan barcode to sell…  (F2)" oninput="onSearchInput()" autocomplete="off">
            <button class="barbtn" onclick="openCamScan(c=>handleScan(c))" title="Scan with camera">📷 Scan</button>
            <button class="barbtn" onclick="openLostSale()" title="Record a lost sale">📉 Lost</button>
          </div>
          <div class="cats" id="cats"></div>
          <div class="grid" id="productGrid"></div>
        </div>
        <div class="cart">
          <div class="cart-head"><b>🛒 Cart</b><span class="tag gray" id="cartCount">0 items</span><span class="spacer" style="flex:1"></span><select id="cartCustomer" style="width:auto;max-width:160px;padding:6px 8px;font-size:12px"></select><button class="ci-del" title="Clear cart" onclick="clearCart()">🗑</button></div>
          <div class="cart-items" id="cartItems"><div class="empty">Cart is empty.<br>Click or scan items to add them.</div></div>
          <div class="cart-foot">
            <div class="totrow"><span>Subtotal</span><span id="tSub">Rs 0</span></div>
            <div class="totrow"><span>Discount <span id="discLink"></span></span><span id="tDisc">- Rs 0</span></div>
            <div class="totrow" id="taxLines"></div>
            <div class="totrow grand"><span>TOTAL</span><span id="tGrand">Rs 0</span></div>
            <div class="btnrow"><button class="btn btn-ghost" onclick="holdSale()">Hold (F4)</button><button class="btn btn-amber" onclick="openHeld()">Parked <span id="heldCount"></span></button></div>
            <button class="btn btn-primary" style="font-size:16px;padding:14px" onclick="openCheckout()" id="payBtn">💳 CHARGE — Rs 0  (F9)</button>
          </div>
        </div>
      </div>
    </div>
    <div class="view hidden" id="view-dashboard"></div>
    <div class="view hidden" id="view-products"></div>
    
    <div class="view hidden" id="view-requests"></div>
    <div class="view hidden" id="view-customers"></div>
    <div class="view hidden" id="view-users"></div>
    <div class="view hidden" id="view-sales"></div>
    <div class="view hidden" id="view-reports"></div>
    <div class="view hidden" id="view-display"></div>
    <div class="view hidden" id="view-settings"></div>
    <div class="footer">Powered by <b>3S Verse POS</b> · v1.0</div>
  </div>
</div>
<div class="login-wrap" id="loginScreen" style="display:none"></div>
<div id="modalRoot"></div>
<div id="printArea" class="no-print" style="display:none"></div>

function money(n){return S.currency+' '+Number(n).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2})}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');setTimeout(()=>t.className='',2600)}
function taxById(id){return TAXES.find(t=>t.id===id)||{name:'No Tax',rate:0}}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function shade(hex,p){try{let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);const f=(1+p/100);r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return hex}}
function applyTheme(){const r=document.documentElement.style;const sc=SCHEMES[S.scheme]||SCHEMES.midnight;['bg','panel','panel2','line','txt','muted','accent','accent2'].forEach(k=>r.setProperty('--'+k,sc[k]));if(S.accent){r.setProperty('--accent',S.accent);r.setProperty('--accent2',shade(S.accent,-18))}const tb=document.getElementById('themeBtn');if(tb)tb.textContent=sc.dark?'🌙':'☀️';document.body.style.background=sc.bg;}
function toggleTheme(){const sc=SCHEMES[S.scheme]||SCHEMES.midnight;S.scheme=sc.dark?'light':'midnight';save();applyTheme();if(!document.getElementById('view-display').classList.contains('hidden'))renderDisplay();}

function adminObj(){return {id:'__admin',name:(S.adminName||'Owner'),admin:true,perms:{},img:S.logo}}
function can(p){if(!p)return true;return !!(currentUser&&(currentUser.admin||(currentUser.perms&&currentUser.perms[p])))}
function startSession(){if(!S.setupDone){renderProducts();renderCart();updateSyncPill();setTimeout(()=>openSetup(false),300);return}if(S.requireLogin){showLogin()}else{currentUser=adminObj();afterLogin()}}
function showLogin(){const el=document.getElementById('loginScreen');el.style.display='flex';el.innerHTML=`<div class="login-card"><img class="login-logo" src="${S.logo||LOGO_DATAURL}"><h2>${esc(S.storeName)}</h2><div class="sub">Sign in with your email & password</div><div class="field"><label>Email</label><input id="liEmail" placeholder="you@store.com"></div><div class="field"><label>Password</label><input id="liPass" type="password"></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="doLogin()">Sign in</button><p class="help" style="text-align:center;margin-top:12px">Admin email: <b>${esc(S.adminEmail||'admin')}</b></p></div>`;setTimeout(()=>{const i=document.getElementById('liEmail');if(i)i.focus()},60);}
function doLogin(){const em=(document.getElementById('liEmail').value||'').trim().toLowerCase();const pw=document.getElementById('liPass').value||'';if(em===(S.adminEmail||'admin').toLowerCase()&&pw===(S.adminPassword||'')){currentUser=adminObj();afterLogin();return}const u=USERS.find(x=>x.active!==false&&(x.email||'').toLowerCase()===em);if(u&&(u.password||'')===pw){currentUser={id:u.id,name:u.name||((u.firstName||'')+' '+(u.lastName||'')).trim()||u.email,admin:false,perms:u.perms||{},img:u.img};afterLogin();return}toast('Wrong email or password',true);}
function afterLogin(){document.getElementById('loginScreen').style.display='none';updateUserChip();applyPerms();updateReqBadge();const order=['pos','dashboard','products','requests','customers','users','sales','reports','display','settings'];const first=order.find(v=>can(VIEW_PERM[v]))||'pos';nav(first);renderCart();toast('Welcome, '+currentUser.name);}
function logout(){currentUser=null;showLogin()}
function updateUserChip(){const c=document.getElementById('userChip'),b=document.getElementById('logoutBtn');if(!c)return;if(currentUser){c.style.display='flex';c.innerHTML=(currentUser.img?`<img src="${currentUser.img}">`:'👤')+' '+esc(currentUser.name)+(currentUser.admin?' · Admin':'');b.style.display='inline-flex'}else{c.style.display='none';b.style.display='none'}}
function applyPerms(){document.querySelectorAll('.navbtn').forEach(btn=>{const perm=VIEW_PERM[btn.dataset.view];btn.style.display=can(perm)?'flex':'none'});}

/* ===== CAMERA SCANNER (ZXing) ===== */
let zx=null,camCb=null,camActive=false,camStream=null,camTrack=null,camTorch=false,camDetector=null,camPoll=null;
function openCamScan(cb){camCb=cb;camTorch=false;modal(`<div class="modal-head"><h3>📷 Scan barcode</h3><button class="x" onclick="closeCam()">×</button></div><div class="modal-body" style="text-align:center"><video id="camVid" style="width:100%;max-height:340px;background:#000;border-radius:10px;object-fit:cover" muted playsinline autoplay></video><div class="btnrow" style="margin-top:8px"><button class="barbtn" onclick="toggleTorch()">🔦 Flashlight</button></div><p class="help" id="camMsg">Hold the barcode flat and fill the frame in good light…</p><div class="field" style="margin-top:8px"><input id="camManual" placeholder="…or type the barcode and press Enter" onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v){const cb=camCb;closeCam();if(cb)cb(v)}}"></div></div>`);setTimeout(startCam,150);}
async function startCam(){
  const msg=document.getElementById('camMsg');const v=document.getElementById('camVid');camActive=true;
  const onScan=(code)=>{if(!camActive||!code)return;camActive=false;const cb=camCb;closeCam();if(cb)cb(String(code).trim());};
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]},audio:false});
    if(v){v.srcObject=camStream;try{await v.play()}catch(e){}}
    camTrack=camStream.getVideoTracks?camStream.getVideoTracks()[0]:null;
    if('BarcodeDetector' in window){
      try{camDetector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code']});}catch(e){camDetector=new window.BarcodeDetector();}
      const tick=async()=>{if(!camActive)return;try{const codes=await camDetector.detect(v);if(codes&&codes.length){onScan(codes[0].rawValue);return}}catch(e){}camPoll=setTimeout(tick,150);};
      tick();
    }else if(typeof ZXing!=='undefined'){
      if(!zx)zx=new ZXing.BrowserMultiFormatReader();
      try{zx.decodeFromVideoElement(v,function(res){if(res)onScan(res.getText());});}
      catch(e){try{zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},'camVid',function(res){if(res)onScan(res.getText());});}catch(e2){if(msg)msg.textContent='Camera scan failed — type the barcode below.';}}
    }else{if(msg)msg.textContent='Scanner not available here — type the barcode below.';}
  }catch(e){if(msg)msg.textContent='Camera blocked — allow camera permission, or type the barcode below.';}
}
function toggleTorch(){if(!camTrack){toast('Flashlight not ready yet',true);return}try{const caps=camTrack.getCapabilities?camTrack.getCapabilities():{};if(!caps.torch){toast('This camera has no flashlight',true);return}camTorch=!camTorch;camTrack.applyConstraints({advanced:[{torch:camTorch}]});}catch(e){toast('Flashlight not available',true)}}
function closeCam(){camActive=false;camTorch=false;if(camPoll){clearTimeout(camPoll);camPoll=null}try{if(zx)zx.reset()}catch(e){}try{if(camStream)camStream.getTracks().forEach(t=>t.stop())}catch(e){}camStream=null;camTrack=null;camDetector=null;closeModal();}


function categories(){return ['All',...Array.from(new Set(PRODUCTS.map(p=>p.cat))).sort()]}
function renderCats(){document.getElementById('cats').innerHTML=categories().map(c=>`<button class="cat ${c===curCat?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('');}
function setCat(c){curCat=c;renderCats();renderProducts()}
function renderProducts(){renderCats();const q=document.getElementById('search').value.trim().toLowerCase();let list=PRODUCTS.filter(p=>(curCat==='All'||p.cat===curCat));if(q)list=PRODUCTS.filter(p=>[p.name,p.sku,p.barcode].join(' ').toLowerCase().includes(q));const g=document.getElementById('productGrid');if(!list.length){g.innerHTML='<div class="empty">No items match.</div>';return}g.innerHTML=list.map(p=>{const sb=p.stock<=0?'<span class="stockbadge out">Out</span>':(p.stock<=S.lowStockThreshold?`<span class="stockbadge low">${p.stock} left</span>`:`<span class="stockbadge">${p.stock}</span>`);const box=(p.piecesPerBox||1)>1?` · box/${p.piecesPerBox}`:'';return `<div class="card" onclick="addToCart('${p.id}')">${sb}<div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="meta"><span>${esc(p.sku||'')}${box}</span><span>${taxById(p.taxId).rate}%</span></div></div>`}).join('');}
function findByCode(code){code=(code||'').trim();if(!code)return null;return PRODUCTS.find(x=>x.barcode===code)||PRODUCTS.find(x=>(x.sku||'').toLowerCase()===code.toLowerCase())||null;}
function handleScan(code){const p=findByCode(code);if(!p){quickAddProduct(code,'sell');return}addUnit(p,'pc',1);toast('🛒 '+p.name+' added');}
function onSearchInput(){renderProducts();const v=document.getElementById('search').value.trim();if(v&&PRODUCTS.some(x=>x.barcode===v)){handleScan(v);document.getElementById('search').value='';renderProducts();}}

function addToCart(id){if(!can('sales')){toast('No permission to make sales',true);return}const p=PRODUCTS.find(x=>x.id===id);if(!p)return;if((p.piecesPerBox||1)>1){openUnitPick(p)}else{addUnit(p,'pc',1)}}
function openUnitPick(p){const boxPcs=p.piecesPerBox||1;const boxPrice=p.boxPrice||p.price*boxPcs;modal(`<div class="modal-head"><h3>Add ${esc(p.name)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><p class="help" style="margin-bottom:12px">Sell as a single piece or a full box?</p><div class="row2"><button class="btn btn-ghost" style="padding:18px" onclick="closeModal();addUnit(PRODUCTS.find(x=>x.id==='${p.id}'),'pc',1)"><div style="font-size:15px;font-weight:700">Piece</div><div style="color:var(--accent);font-weight:700">${money(p.price)}</div></button><button class="btn btn-primary" style="padding:18px" onclick="closeModal();addUnit(PRODUCTS.find(x=>x.id==='${p.id}'),'box',1)"><div style="font-size:15px;font-weight:700">Box of ${boxPcs}</div><div style="font-weight:700">${money(boxPrice)}</div></button></div></div>`);}
function usedPieces(id){return cart.filter(c=>c.id===id).reduce((a,c)=>a+c.qty*c.pcs,0)}
function addUnit(p,unit,qty){if(!p)return;const pcs=unit==='box'?(p.piecesPerBox||1):1;const price=unit==='box'?(p.boxPrice||p.price*(p.piecesPerBox||1)):p.price;if((p.stock||0)-usedPieces(p.id)-qty*pcs<0){toast('Not enough stock for '+p.name,true);return}const key=p.id+'_'+unit;const ex=cart.find(c=>c.key===key);if(ex)ex.qty+=qty;else cart.push({key,id:p.id,name:p.name+(unit==='box'?' (Box of '+pcs+')':''),price,taxId:p.taxId,qty,unit,pcs,lineDisc:0});renderCart();}
function changeQty(key,d){const c=cart.find(x=>x.key===key);if(!c)return;const p=PRODUCTS.find(x=>x.id===c.id);c.qty+=d;if(c.qty<=0){cart=cart.filter(x=>x.key!==key)}else if(p&&usedPieces(c.id)>p.stock){c.qty-=d;toast('Not enough stock',true)}renderCart();}
function setQty(key,v){const c=cart.find(x=>x.key===key);if(!c)return;const p=PRODUCTS.find(x=>x.id===c.id);let q=parseInt(v)||0;if(q<=0){cart=cart.filter(x=>x.key!==key);renderCart();return}const others=cart.filter(x=>x.id===c.id&&x.key!==key).reduce((a,x)=>a+x.qty*x.pcs,0);if(p&&others+q*c.pcs>p.stock){toast('Not enough stock',true);renderCart();return}c.qty=q;renderCart();}
function removeItem(key){cart=cart.filter(x=>x.key!==key);renderCart()}
function clearCart(){if(cart.length&&!confirm('Clear the cart?'))return;cart=[];cartDiscount={type:'amount',value:0};renderCart()}
function calcTotals(items,disc){items=items||cart;disc=disc||cartDiscount;let sub=0;items.forEach(c=>{let line=c.price*c.qty-(c.lineDisc||0);if(line<0)line=0;sub+=line});let d=disc.type==='percent'?sub*disc.value/100:disc.value;if(d>sub)d=sub;const afterDisc=sub-d;const ratio=sub>0?afterDisc/sub:0;let taxTotal=0,taxMap={};items.forEach(c=>{const t=taxById(c.taxId);let line=(c.price*c.qty-(c.lineDisc||0));if(line<0)line=0;const adj=line*ratio;let tax=S.taxInclusive?(adj-adj/(1+t.rate/100)):(adj*t.rate/100);taxMap[t.name]=(taxMap[t.name]||0)+tax;taxTotal+=tax;});const grand=S.taxInclusive?afterDisc:afterDisc+taxTotal;return {sub,disc:d,afterDisc,taxMap,taxTotal,grand};}
function renderCart(){const box=document.getElementById('cartItems');document.getElementById('cartCount').textContent=cart.reduce((a,c)=>a+c.qty,0)+' items';document.getElementById('discLink').innerHTML=can('discounts')?'<a href="#" onclick="openDiscount();return false" style="color:var(--blue);font-size:11px">edit</a>':'';if(!cart.length){box.innerHTML='<div class="empty">Cart is empty.<br>Click or scan items to add them.</div>'}else{box.innerHTML=cart.map(c=>{const line=c.price*c.qty-(c.lineDisc||0);return `<div class="citem"><div class="ci-name">${esc(c.name)}<small>${money(c.price)} × ${c.qty}</small></div><div class="qty"><button onclick="changeQty('${c.key}',-1)">−</button><input value="${c.qty}" onchange="setQty('${c.key}',this.value)"><button onclick="changeQty('${c.key}',1)">+</button></div><div class="ci-total">${money(line)}</div><button class="ci-del" onclick="removeItem('${c.key}')">×</button></div>`}).join('')}const t=calcTotals();document.getElementById('tSub').textContent=money(t.sub);document.getElementById('tDisc').textContent='- '+money(t.disc);document.getElementById('taxLines').innerHTML=Object.entries(t.taxMap).filter(([k,v])=>v>0.001).map(([k,v])=>`<span>${esc(k)}</span><span>${money(v)}</span>`).join('</div><div class="totrow">')||'<span>Tax</span><span>Rs 0</span>';document.getElementById('tGrand').textContent=money(t.grand);document.getElementById('payBtn').textContent='💳 CHARGE — '+money(t.grand)+'  (F9)';document.getElementById('payBtn').disabled=!cart.length;document.getElementById('heldCount').textContent=HELD.length?'('+HELD.length+')':'';const sel=document.getElementById('cartCustomer');sel.innerHTML=CUSTOMERS.map(c=>`<option value="${c.id}" ${c.id===curCustomer?'selected':''}>${esc(c.name)}</option>`).join('');sel.onchange=e=>curCustomer=e.target.value;}
function openDiscount(){if(!can('discounts')){toast('No permission for discounts',true);return}modal(`<div class="modal-head"><h3>Cart Discount</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Discount type</label><select id="dType"><option value="amount" ${cartDiscount.type==='amount'?'selected':''}>Fixed Amount (${S.currency})</option><option value="percent" ${cartDiscount.type==='percent'?'selected':''}>Percentage (%)</option></select></div><div class="field"><label>Value</label><input id="dVal" type="number" inputmode="decimal" min="0" value="${cartDiscount.value}"></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 18px" onclick="applyDiscount()">Apply</button></div>`);}
function applyDiscount(){cartDiscount={type:document.getElementById('dType').value,value:parseFloat(document.getElementById('dVal').value)||0};closeModal();renderCart();toast('Discount applied')}

/* ===== STOCK-IN (separate tab) ===== */
function openStockInModal(){
  if(!can('products')){toast('No permission for stock-in',true);return}
  modal(`<div class="modal-head"><h3>📥 Stock-In — receive items by scanning</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <p class="help" style="margin-bottom:10px">Scan or type a barcode to add it to inventory. Unknown barcodes create a new product (auto-named by category). A USB scanner types into the box; or use the camera.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="siInput" placeholder="Scan / type barcode, then Enter" onkeydown="if(event.key==='Enter'){stockInScan(this.value);this.value=''}" style="min-width:55%"><input id="siQty" type="number" inputmode="decimal" value="1" style="width:90px" title="Qty per scan"><button class="barbtn" onclick="openCamScan(c=>{stockInScan(c);setTimeout(openStockInModal,250)})">📷 Camera</button></div>
    <div class="tablewrap" style="max-height:300px;margin-top:12px"><table><thead><tr><th>Time</th><th>Item</th><th>+Qty</th><th>New Stock</th></tr></thead><tbody id="siModalList"></tbody></table></div>
  </div>
  <div class="modal-foot"><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="closeModal()">Done</button></div>`);
  renderSiList();setTimeout(()=>{const i=document.getElementById('siInput');if(i)i.focus()},60);
}
function renderSiList(){const b=document.getElementById('siModalList');if(!b)return;b.innerHTML=stockInLog.length?stockInLog.slice(0,50).map(l=>`<tr><td>${new Date(l.time).toLocaleTimeString()}</td><td><b>${esc(l.name)}</b> <small style="color:var(--muted)">${esc(l.sku||'')}</small></td><td><span class="tag green">+${l.qty}</span></td><td>${l.newStock}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">Nothing received yet — start scanning.</div></td></tr>';}
function stockInScan(code){if(!can('products')){toast('No permission',true);return}const p=findByCode(code);if(!p){quickAddProduct(code,'stockin');return}const qf=document.getElementById('siQty');const qty=Math.max(1,parseInt(qf&&qf.value)||1);p.stock=(p.stock||0)+qty;stockInLog.unshift({time:Date.now(),name:p.name,sku:p.sku,qty,newStock:p.stock});save();renderProducts();if(document.getElementById('prodTable'))renderProductsTable2();renderSiList();toast('📥 '+p.name+' +'+qty+' → '+p.stock);}

function quickAddProduct(code,mode){
  if(!can('products')){toast('Unknown barcode — you need product permission to add it',true);return}
  const cats=categories().filter(c=>c!=='All');
  modal(`<div class="modal-head"><h3>🆕 New item — barcode ${esc(code)}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <p class="help" style="margin-bottom:10px">This barcode isn't in your catalog yet. Pick a category and price — the <b>name and SKU are created automatically from the category</b>. No typing the barcode or name.</p>
    <div class="row2"><div class="field"><label>Category *</label><input id="qaCat" list="qaCats" value="${esc(cats[0]||'General')}" oninput="qaName()"><datalist id="qaCats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
      <div class="field"><label>Auto name</label><input id="qaName" readonly></div></div>
    <div class="row3"><div class="field"><label>Sale Price (${S.currency}) *</label><input id="qaPrice" type="number" inputmode="decimal" autofocus></div>
      <div class="field"><label>Cost (${S.currency})</label><input id="qaCost" type="number" inputmode="decimal" value="0"></div>
      <div class="field"><label>${mode==='stockin'?'Stock to add':'Stock'}</label><input id="qaQty" type="number" inputmode="decimal" value="1"></div></div>
    <div class="field"><label>Tax Slab</label><select id="qaTax">${TAXES.map(t=>`<option value="${t.id}" ${t.id==='gst18'?'selected':''}>${esc(t.name)} — ${t.rate}%</option>`).join('')}</select></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveQuickProduct('${code}','${mode}')">Save &amp; ${mode==='stockin'?'add stock':'add to cart'}</button></div>`);
  qaName();setTimeout(()=>{const p=document.getElementById('qaPrice');if(p)p.focus()},60);
}
function qaName(){const c=document.getElementById('qaCat');const n=document.getElementById('qaName');if(!c||!n)return;const cat=c.value.trim()||'General';n.value=cat+' '+previewSku(cat);}
function saveQuickProduct(code,mode){
  const cat=document.getElementById('qaCat').value.trim()||'General';
  const price=parseFloat(document.getElementById('qaPrice').value)||0;
  if(price<=0){toast('Enter a sale price',true);return}
  const cost=parseFloat(document.getElementById('qaCost').value)||0;
  const qty=Math.max(0,parseInt(document.getElementById('qaQty').value)||0);
  const taxId=document.getElementById('qaTax').value;
  const sku=nextSku(cat);const name=cat+' '+sku;
  const p={id:uid('p'),name,sku,barcode:code,cat,unit:'pc',cost,price,stock:qty,piecesPerBox:1,boxPrice:0,taxId};
  PRODUCTS.push(p);save();renderProducts();
  if(document.getElementById('prodTable'))renderProductsTable2();
  if(mode==='stockin'){stockInLog.unshift({time:Date.now(),name:p.name,sku:p.sku,qty,newStock:p.stock});closeModal();toast('✓ Created '+name+' · stock '+p.stock);setTimeout(openStockInModal,150);}
  else{closeModal();if(p.stock<1)p.stock=1;addUnit(p,'pc',1);toast('✓ Created '+name+' and added to cart');}
}

function openLostSale(){if(!can('sales')){toast('No permission',true);return}modal(`<div class="modal-head"><h3>📉 Record Lost Sale</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Item the customer wanted</label><input id="lsItem" placeholder="e.g. Brand X Cooking Oil" list="lsList"><datalist id="lsList">${PRODUCTS.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div><div class="row2"><div class="field"><label>Quantity</label><input id="lsQty" type="number" inputmode="decimal" value="1" min="1"></div><div class="field"><label>Est. value (${S.currency})</label><input id="lsVal" type="number" inputmode="decimal" value="0"></div></div><div class="field"><label>Reason</label><select id="lsReason"><option>Out of stock</option><option>We don't carry it</option><option>Price too high</option><option>Customer left</option><option>Other</option></select></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveLostSale()">Record</button></div>`);}
function saveLostSale(){const item=document.getElementById('lsItem').value.trim();if(!item){toast('Enter the item',true);return}LOST.unshift({id:uid('l'),time:Date.now(),item,qty:parseInt(document.getElementById('lsQty').value)||1,value:parseFloat(document.getElementById('lsVal').value)||0,reason:document.getElementById('lsReason').value,user:currentUser?currentUser.name:'Admin'});save();closeModal();toast('Lost sale recorded');}

function holdSale(){if(!cart.length){toast('Cart is empty',true);return}HELD.push({id:uid('h'),time:Date.now(),cart:JSON.parse(JSON.stringify(cart)),customer:curCustomer,discount:cartDiscount,note:'Held '+new Date().toLocaleTimeString()});save();cart=[];cartDiscount={type:'amount',value:0};renderCart();toast('Sale parked')}
function openHeld(){if(!HELD.length){toast('No parked sales',true);return}modal(`<div class="modal-head"><h3>Parked Sales (${HELD.length})</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">${HELD.map(h=>{const cnt=h.cart.reduce((a,c)=>a+c.qty,0);const cust=(CUSTOMERS.find(c=>c.id===h.customer)||{}).name||'';return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px"><div style="flex:1"><b>${esc(h.note)}</b><br><small style="color:var(--muted)">${cnt} items · ${esc(cust)}</small></div><button class="barbtn green" onclick="resumeHeld('${h.id}')">Resume</button><button class="ci-del" onclick="deleteHeld('${h.id}')">🗑</button></div>`}).join('')}</div>`);}
function resumeHeld(id){const h=HELD.find(x=>x.id===id);if(!h)return;if(cart.length&&!confirm('Replace current cart?'))return;cart=h.cart.map(c=>Object.assign({key:c.key||(c.id+'_'+(c.unit||'pc')),unit:c.unit||'pc',pcs:c.pcs||1},c));curCustomer=h.customer;cartDiscount=h.discount;HELD=HELD.filter(x=>x.id!==id);save();closeModal();renderCart();toast('Sale resumed')}
function deleteHeld(id){HELD=HELD.filter(x=>x.id!==id);save();openHeld();renderCart()}

let payState={method:'Cash',tendered:0};
function openCheckout(){if(!cart.length)return;if(!can('sales')){toast('No permission to make sales',true);return}const t=calcTotals();payState={method:'Cash',tendered:0};modal(`<div class="modal-head"><h3>Checkout — ${money(t.grand)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="pay-methods" id="payMethods">${['Cash','Card','Easypaisa','JazzCash','Bank Transfer','Credit'].map(m=>`<div class="pay-opt ${m==='Cash'?'active':''}" data-m="${m}" onclick="selPay('${m}')">${m}</div>`).join('')}</div><div id="cashBlock"><div class="numbig" id="tenderDisplay">0</div><div class="row3" style="margin-bottom:8px">${[t.grand,500,1000,5000].map(v=>`<button class="barbtn" onclick="quickTender(${Math.ceil(v)})">${v===t.grand?'Exact':money(v)}</button>`).join('')}</div><input id="tenderInput" type="number" inputmode="decimal" placeholder="Amount received" oninput="payState.tendered=parseFloat(this.value)||0;updateChange()"><div class="totrow grand" style="margin-top:10px"><span>Change</span><span class="change-amt" id="changeAmt">${money(0)}</span></div></div><div class="field" style="margin-top:10px"><label>Customer</label><select id="coCustomer">${CUSTOMERS.map(c=>`<option value="${c.id}" ${c.id===curCustomer?'selected':''}>${esc(c.name)}${c.phone?' ('+c.phone+')':''}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:11px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:11px 26px" onclick="completeSale()">✓ Complete &amp; Print</button></div>`);setTimeout(()=>{const i=document.getElementById('tenderInput');if(i)i.focus()},50);}
function selPay(m){payState.method=m;document.querySelectorAll('.pay-opt').forEach(o=>o.classList.toggle('active',o.dataset.m===m));document.getElementById('cashBlock').style.display=(m==='Cash')?'block':'none';}
function quickTender(v){payState.tendered=v;document.getElementById('tenderInput').value=v;updateChange()}
function updateChange(){const t=calcTotals();document.getElementById('tenderDisplay').textContent=money(payState.tendered);const ch=payState.tendered-t.grand;document.getElementById('changeAmt').textContent=money(ch>0?ch:0);}
function nextInvoice(){S.invoiceCounter=(S.invoiceCounter||1000)+1;return (S.invoicePrefix||'INV')+'-'+S.invoiceCounter}
function completeSale(){const t=calcTotals();const cust=document.getElementById('coCustomer').value;if(payState.method==='Cash'&&payState.tendered<t.grand){if(!confirm('Tendered amount is less than total. Continue anyway?'))return}const inv=nextInvoice();const sale={id:uid('s'),invoice:inv,time:Date.now(),items:cart.map(c=>({id:c.id,name:c.name,price:c.price,qty:c.qty,unit:c.unit,pcs:c.pcs,taxId:c.taxId,lineDisc:c.lineDisc||0})),customer:cust,method:payState.method,tendered:payState.tendered,discount:cartDiscount,sub:t.sub,discAmt:t.disc,taxMap:t.taxMap,taxTotal:t.taxTotal,grand:t.grand,change:Math.max(0,payState.tendered-t.grand),status:'completed',cashier:currentUser?currentUser.name:'Admin'};cart.forEach(c=>{const p=PRODUCTS.find(x=>x.id===c.id);if(p)p.stock=Math.max(0,p.stock-c.qty*c.pcs)});const cobj=CUSTOMERS.find(c=>c.id===cust);if(cobj&&!cobj.walkin)cobj.points=(cobj.points||0)+Math.floor(t.grand/100);if(cobj&&payState.method==='Credit')cobj.credit=(cobj.credit||0)+t.grand;SALES.unshift(sale);save();cart=[];cartDiscount={type:'amount',value:0};closeModal();renderCart();renderProducts();showReceipt(sale);toast('Sale completed — '+inv);}

function buildReceiptHTML(sale){const cust=CUSTOMERS.find(c=>c.id===sale.customer)||{name:'Walk-in Customer'};const d=new Date(sale.time);const thermal=S.receiptSize==='thermal';const W=thermal?'272px':'700px';const fs=thermal?'12px':'14px';const fam=thermal?"'Courier New',monospace":"'Segoe UI',sans-serif";const rows=sale.items.map(it=>{const t=taxById(it.taxId);const line=it.price*it.qty-(it.lineDisc||0);return `<tr><td style="padding:3px 0;vertical-align:top">${esc(it.name)}<br><span style="color:#555;font-size:10px">${it.qty} × ${S.currency}${it.price.toLocaleString()}${t.rate?' · GST '+t.rate+'%':''}</span></td><td style="text-align:right;padding:3px 0;white-space:nowrap;vertical-align:top">${S.currency}${line.toLocaleString()}</td></tr>`}).join('');const taxRows=Object.entries(sale.taxMap).filter(([k,v])=>v>0.001).map(([k,v])=>`<tr><td style="color:#444">${esc(k)}</td><td style="text-align:right">${S.currency}${Math.round(v).toLocaleString()}</td></tr>`).join('');return `<div style="width:${W};margin:0 auto;background:#fff;color:#000;padding:${thermal?'6px 8px':'34px'};font-family:${fam};font-size:${fs};line-height:1.35"><div style="text-align:center;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:6px">${S.logo?`<img src="${S.logo}" style="max-height:56px;max-width:90%;margin-bottom:4px">`:''}<div style="font-size:${thermal?'17px':'26px'};font-weight:800">${esc(S.storeName)}</div>${S.tagline?`<div style="font-size:10px">${esc(S.tagline)}</div>`:''}<div style="font-size:10px">${esc(S.address)}</div><div style="font-size:10px">Tel: ${esc(S.phone)}</div>${S.ntn?`<div style="font-size:10px">NTN: ${esc(S.ntn)}${S.strn?' · STRN: '+esc(S.strn):''}</div>`:''}</div><div style="font-size:11px;margin-bottom:5px"><div style="display:flex;justify-content:space-between"><b>${esc(sale.invoice)}</b><span>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div style="display:flex;justify-content:space-between"><span>Cashier: ${esc(sale.cashier||'Admin')}</span><span>${esc(cust.name)}</span></div>${sale.status==='refunded'?'<div style="text-align:center;color:#b91c1c;font-weight:800;margin-top:3px">*** RETURNED ***</div>':''}</div><table style="width:100%;border-collapse:collapse;border-top:1px solid #000;border-bottom:1px solid #000"><thead><tr><th style="text-align:left;padding:2px 0;font-size:10px">ITEM</th><th style="text-align:right;padding:2px 0;font-size:10px">AMOUNT</th></tr></thead><tbody>${rows}</tbody></table><table style="width:100%;border-collapse:collapse;margin-top:5px;font-size:11px"><tr><td>Subtotal</td><td style="text-align:right">${S.currency}${Math.round(sale.sub).toLocaleString()}</td></tr>${sale.discAmt>0?`<tr><td>Discount</td><td style="text-align:right">- ${S.currency}${Math.round(sale.discAmt).toLocaleString()}</td></tr>`:''}${taxRows}<tr style="border-top:1px solid #000;font-weight:800;font-size:${thermal?'14px':'18px'}"><td style="padding-top:4px">TOTAL</td><td style="text-align:right;padding-top:4px">${S.currency}${Math.round(sale.grand).toLocaleString()}</td></tr><tr><td>Paid (${esc(sale.method)})</td><td style="text-align:right">${S.currency}${Math.round(sale.tendered||sale.grand).toLocaleString()}</td></tr>${sale.change>0?`<tr><td>Change</td><td style="text-align:right">${S.currency}${Math.round(sale.change).toLocaleString()}</td></tr>`:''}</table><div style="text-align:center;margin-top:8px;border-top:1px dashed #000;padding-top:6px;font-size:10px">${esc(S.footer||'')}<div style="margin-top:6px;font-family:monospace;letter-spacing:2px;font-size:13px">*${esc(sale.invoice)}*</div><div style="margin-top:3px">Powered by 3S Verse POS</div></div></div>`;}
function showReceipt(sale){const exists=SALES.some(s=>s.id===sale.id);modal(`<div class="modal-head"><h3>Invoice ${esc(sale.invoice)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body" style="background:#334155;padding:14px"><div id="rcptPreview">${buildReceiptHTML(sale)}</div></div><div class="modal-foot"><button class="btn btn-blue" style="flex:0;padding:11px 16px" onclick="printReceipt('${sale.id}')">🖨 Print</button><button class="btn btn-ghost" style="flex:0;padding:11px 16px" onclick="saveInvoiceImage('${sale.id}')">🖼 Save Image</button><button class="btn" style="flex:0;padding:11px 16px;background:#25D366;color:#fff" onclick="whatsappReceipt('${sale.id}')">💬 WhatsApp</button>${(exists&&sale.status!=='refunded'&&can('refunds'))?`<button class="btn btn-amber" style="flex:0;padding:11px 16px" onclick="editInvoice('${sale.id}')">✏️ Edit / Return</button>`:''}<button class="btn btn-primary" style="flex:0;padding:11px 20px" onclick="closeModal()">Done</button></div>`,'wide');}
function printReceipt(id){const sale=SALES.find(s=>s.id===id);if(!sale)return;const w=window.open('','_blank','width=320,height=600');w.document.write(`<html><head><title>${esc(sale.invoice)}</title><style>@page{size:80mm auto;margin:0}html,body{margin:0;padding:0;width:80mm;background:#fff}</style></head><body onload="window.print();setTimeout(()=>window.close(),400)">${buildReceiptHTML(sale)}</body></html>`);w.document.close();}
async function renderInvoiceCanvas(sale){const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-9999px';holder.style.top='0';holder.innerHTML=buildReceiptHTML(sale);document.body.appendChild(holder);const canvas=await html2canvas(holder.firstChild,{scale:2,backgroundColor:'#ffffff'});document.body.removeChild(holder);return canvas;}
async function saveInvoiceImage(id){const sale=SALES.find(s=>s.id===id);if(!sale)return;if(typeof html2canvas==='undefined'){toast('Image tool needs internet the first time',true);return}try{const canvas=await renderInvoiceCanvas(sale);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=sale.invoice+'.png';a.click();toast('Invoice image saved');}catch(e){toast('Could not make image',true)}}
function buildWaText(sale){const cust=CUSTOMERS.find(c=>c.id===sale.customer)||{name:'Customer'};const lines=sale.items.map(it=>`• ${it.name}  ${it.qty}x${S.currency}${it.price} = ${S.currency}${(it.price*it.qty-(it.lineDisc||0)).toLocaleString()}`).join('\n');const taxStr=Object.entries(sale.taxMap).filter(([k,v])=>v>0.001).map(([k,v])=>`${k}: ${S.currency}${Math.round(v).toLocaleString()}`).join('\n');return `*${S.storeName}*\n${S.address}\nTel: ${S.phone}\n\n*Invoice ${sale.invoice}*\n${new Date(sale.time).toLocaleString()}\nCustomer: ${cust.name}\n\n${lines}\n\nSubtotal: ${S.currency}${Math.round(sale.sub).toLocaleString()}`+(sale.discAmt>0?`\nDiscount: -${S.currency}${Math.round(sale.discAmt).toLocaleString()}`:'')+(taxStr?`\n${taxStr}`:'')+`\n*TOTAL: ${S.currency}${Math.round(sale.grand).toLocaleString()}*\nPaid via ${sale.method}\n\n${S.footer||'Thank you!'}`;}
function whatsappReceipt(id){const sale=SALES.find(s=>s.id===id);if(!sale)return;const cust=CUSTOMERS.find(c=>c.id===sale.customer)||{};let phone=(cust.phone||'').replace(/[^0-9]/g,'');modal(`<div class="modal-head"><h3>💬 Send invoice on WhatsApp</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Recipient WhatsApp number</label><div style="display:flex;gap:8px"><input id="waCC" inputmode="numeric" value="${S.whatsappCountry||'92'}" style="width:70px"><input id="waNum" inputmode="numeric" value="${phone}" placeholder="3001234567"></div></div><div class="field"><label>Message (caption)</label><textarea id="waMsg" rows="7" style="font-size:12px">${esc(buildWaText(sale))}</textarea></div><p class="help">${EL?'Click Send — it opens WhatsApp Desktop on this chat and pastes the invoice image. WhatsApp Desktop must be installed & logged in; if it doesn’t auto-send, the image is already on the clipboard — just press Ctrl+V then Enter.':'Click Send — a share sheet opens so you can pick <b>WhatsApp</b> or <b>WhatsApp Business</b>, with the invoice image attached.'}</p></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:11px 16px" onclick="saveInvoiceImage('${sale.id}')">🖼 Save image</button><button class="btn" style="flex:0;padding:11px 20px;background:#25D366;color:#fff" onclick="sendWa('${sale.id}')">💬 Send on WhatsApp</button></div>`);}
async function sendWa(id){
  const sale=SALES.find(s=>s.id===id);if(!sale)return;
  let cc=document.getElementById('waCC').value.replace(/[^0-9]/g,'');let num=document.getElementById('waNum').value.replace(/[^0-9]/g,'');if(num.startsWith('0'))num=num.slice(1);
  if(num.length<7){toast('Enter a valid WhatsApp number',true);return}
  const cap=document.getElementById('waMsg').value;
  let png='',blob=null;
  try{const c=await renderInvoiceCanvas(sale);png=c.toDataURL('image/png');blob=await new Promise(r=>c.toBlob(r,'image/png'));}catch(e){}
  // 1) Desktop app: auto-send via WhatsApp Desktop (image copied to clipboard + pasted)
  if(EL&&window.novapos.waSend){closeModal();toast('Sending on WhatsApp Desktop…');try{const r=await window.novapos.waSend(cc+num,cap,png);toast(r&&r.ok?'✓ Sent — if the image didn’t attach, press Ctrl+V then Enter':'Image copied — press Ctrl+V then Enter in the chat');}catch(e){toast('Image copied — press Ctrl+V then Enter in the chat');}return;}
  // 2) Phone / browsers with Web Share: share sheet attaches the IMAGE and lets you pick WhatsApp or WhatsApp Business
  if(blob){try{const file=new File([blob],sale.invoice+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:cap,title:sale.invoice});closeModal();toast('Choose WhatsApp or WhatsApp Business to send');return;}}catch(e){if(e&&e.name==='AbortError'){return;}}}
  // 3) Fallback: copy image to clipboard + open the chat with the text
  let copied=false;try{if(blob&&navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copied=true}}catch(e){}
  window.open('https://wa.me/'+cc+num+'?text='+encodeURIComponent(cap),'_blank');closeModal();toast(copied?'Image copied — paste it into the chat (long-press → Paste)':'Opening WhatsApp — attach the saved image');
}
function recomputeSale(s){const t=calcTotals(s.items,s.discount||{type:'amount',value:0});s.sub=t.sub;s.discAmt=t.disc;s.taxMap=t.taxMap;s.taxTotal=t.taxTotal;s.grand=t.grand;}
function editInvoice(id){const s=SALES.find(x=>x.id===id);if(!s){toast('Sale not found',true);return}if(!can('refunds')){toast('No permission',true);return}modal(`<div class="modal-head"><h3>Edit / Return — ${esc(s.invoice)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><p class="help" style="margin-bottom:10px">Remove a line to return it to inventory, or replace it with another product.</p><div class="tablewrap" style="max-height:300px"><table><thead><tr><th>Item</th><th>Qty</th><th>Line</th><th></th></tr></thead><tbody>${s.items.map((it,i)=>`<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${money(it.price*it.qty-(it.lineDisc||0))}</td><td style="white-space:nowrap;display:flex;gap:6px"><select id="rep${i}" style="width:auto;font-size:12px;padding:5px"><option value="">Replace with…</option>${PRODUCTS.map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.price)})</option>`).join('')}</select><button class="barbtn" style="padding:5px 9px" onclick="invReplace('${s.id}',${i})">↔</button><button class="ci-del" onclick="invRemove('${s.id}',${i})" title="Return to stock">↩</button></td></tr>`).join('')}</tbody></table></div><div class="totrow grand" style="margin-top:10px"><span>New Total</span><span>${money(s.grand)}</span></div></div><div class="modal-foot"><button class="btn btn-red" style="flex:0;padding:10px 18px" onclick="returnWholeInvoice('${s.id}')">↩ Return Whole Invoice</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="closeModal()">Done</button></div>`,'wide');}
function invRemove(saleId,idx){const s=SALES.find(x=>x.id===saleId);if(!s||!s.items[idx])return;const it=s.items[idx];const pcsBack=it.qty*(it.pcs||1);if(!confirm('Return '+pcsBack+' pcs of '+it.name+' to inventory?'))return;const p=PRODUCTS.find(x=>x.id===it.id);if(p)p.stock+=pcsBack;s.items.splice(idx,1);if(!s.items.length){s.status='refunded'}recomputeSale(s);save();editInvoice(saleId);renderProducts();toast('Item returned to stock');}
function invReplace(saleId,idx){const s=SALES.find(x=>x.id===saleId);if(!s||!s.items[idx])return;const sel=document.getElementById('rep'+idx);const npId=sel&&sel.value;if(!npId){toast('Pick a replacement product',true);return}const np=PRODUCTS.find(p=>p.id===npId);if(!np)return;const old=s.items[idx];const op=PRODUCTS.find(p=>p.id===old.id);const pcsBack=old.qty*(old.pcs||1);if(op)op.stock+=pcsBack;np.stock=Math.max(0,np.stock-old.qty);s.items[idx]={id:np.id,name:np.name,price:np.price,qty:old.qty,unit:'pc',pcs:1,taxId:np.taxId,lineDisc:0};recomputeSale(s);save();editInvoice(saleId);renderProducts();toast('Item replaced');}
function returnWholeInvoice(id){const s=SALES.find(x=>x.id===id);if(!s)return;if(!confirm('Return entire invoice '+s.invoice+'?'))return;s.items.forEach(it=>{const p=PRODUCTS.find(x=>x.id===it.id);if(p)p.stock+=it.qty*(it.pcs||1)});s.status='refunded';save();closeModal();renderProducts();if(document.getElementById('salesTable'))renderSales2();toast('Invoice returned');}

function todayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function renderDashboard(){const today=SALES.filter(s=>s.time>=todayStart()&&s.status!=='refunded');const todaySales=today.reduce((a,s)=>a+s.grand,0);const todayTax=today.reduce((a,s)=>a+s.taxTotal,0);const allSales=SALES.filter(s=>s.status!=='refunded');const totalRev=allSales.reduce((a,s)=>a+s.grand,0);const avg=allSales.length?totalRev/allSales.length:0;const lowStock=PRODUCTS.filter(p=>p.stock<=S.lowStockThreshold);const prodSold={};allSales.forEach(s=>s.items.forEach(it=>{prodSold[it.name]=(prodSold[it.name]||0)+it.qty}));const top=Object.entries(prodSold).sort((a,b)=>b[1]-a[1]).slice(0,6);const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const st=d.getTime(),en=st+86400000;days.push({label:d.toLocaleDateString('en',{weekday:'short'}),val:allSales.filter(s=>s.time>=st&&s.time<en).reduce((a,s)=>a+s.grand,0)})}const maxDay=Math.max(...days.map(d=>d.val),1);document.getElementById('view-dashboard').innerHTML=`<div class="stats"><div class="stat"><div class="ico" style="background:color-mix(in srgb,var(--accent) 18%,transparent)"><span style="color:var(--accent)">₨</span></div><div class="label">Today's Sales</div><div class="val">${money(todaySales)}</div><div class="sub">${today.length} transactions</div></div><div class="stat"><div class="ico" style="background:#1e3a8a55"><span style="color:#93c5fd">∑</span></div><div class="label">Total Revenue</div><div class="val">${money(totalRev)}</div><div class="sub">${allSales.length} sales all-time</div></div><div class="stat"><div class="ico" style="background:#78350f55"><span style="color:#fcd34d">⌀</span></div><div class="label">Avg. Sale Value</div><div class="val">${money(avg)}</div><div class="sub">per transaction</div></div><div class="stat"><div class="ico" style="background:#7f1d1d55"><span style="color:#fca5a5">⚠</span></div><div class="label">Tax Collected (Today)</div><div class="val">${money(todayTax)}</div><div class="sub">GST payable</div></div></div><div class="row2"><div class="panel"><h3>📈 Last 7 Days</h3><div style="display:flex;align-items:flex-end;gap:10px;height:160px">${days.map(d=>`<div style="flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">${d.val?Math.round(d.val/1000)+'k':''}</div><div style="background:linear-gradient(var(--accent),var(--accent2));border-radius:5px 5px 0 0;height:${Math.max(4,d.val/maxDay*120)}px"></div><div style="font-size:11px;color:var(--muted);margin-top:6px">${d.label}</div></div>`).join('')}</div></div><div class="panel"><h3>🏆 Top Sellers</h3>${top.length?top.map(([n,q],i)=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)"><span class="tag ${i<3?'green':'gray'}">${i+1}</span><span style="flex:1">${esc(n)}</span><b>${q} sold</b></div>`).join(''):'<div class="empty">No sales yet</div>'}</div></div><div class="panel"><h3>⚠️ Low Stock Alerts (${lowStock.length})</h3>${lowStock.length?`<table><thead><tr><th>Item</th><th>SKU</th><th>Stock</th><th>Status</th></tr></thead><tbody>${lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'')}</td><td>${p.stock}</td><td>${p.stock<=0?'<span class="tag red">Out of stock</span>':'<span class="tag amber">Low</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">All items well stocked 👍</div>'}</div>`;}

function catPrefix(cat){return ((cat||'GEN').replace(/[^a-zA-Z]/g,'').slice(0,3).toUpperCase())||'GEN'}
function previewSku(cat){const pre=catPrefix(cat);return pre+'-'+String((S.skuCounters[pre]||0)+1).padStart(4,'0')}
function nextSku(cat){const pre=catPrefix(cat);S.skuCounters[pre]=(S.skuCounters[pre]||0)+1;return pre+'-'+String(S.skuCounters[pre]).padStart(4,'0')}
function renderProductsTable(){const v=document.getElementById('view-products');const invValue=PRODUCTS.reduce((a,p)=>a+p.cost*p.stock,0);const retailValue=PRODUCTS.reduce((a,p)=>a+p.price*p.stock,0);v.innerHTML=`<div class="toolbar"><input id="prodSearch" placeholder="🔍 Search products…" style="max-width:260px" oninput="renderProductsTable2()"><span class="pill">Inventory cost: ${money(invValue)}</span><span class="pill">Retail: ${money(retailValue)}</span><span class="spacer"></span><button class="barbtn" onclick="openStockInModal()">📥 Stock-In (scan)</button><button class="barbtn blue" onclick="exportProductsExcel()">⬇ Export Excel</button><button class="barbtn green" onclick="openProductModal()">+ Add Product</button></div><div class="tablewrap"><table id="prodTable"></table></div>`;renderProductsTable2();}
function renderProductsTable2(){const q=(document.getElementById('prodSearch')?.value||'').toLowerCase();let list=PRODUCTS.filter(p=>[p.name,p.sku,p.barcode,p.cat].join(' ').toLowerCase().includes(q));document.getElementById('prodTable').innerHTML=`<thead><tr><th>Name</th><th>SKU / Barcode</th><th>Category</th><th>Cost</th><th>Price</th><th>Box</th><th>Tax</th><th>Stock</th><th></th></tr></thead><tbody>${list.map(p=>{const st=p.stock<=0?'<span class="tag red">'+p.stock+'</span>':(p.stock<=S.lowStockThreshold?'<span class="tag amber">'+p.stock+'</span>':'<span class="tag green">'+p.stock+'</span>');const boxc=(p.piecesPerBox||1)>1?(p.piecesPerBox+'/box'):'—';return `<tr><td><b>${esc(p.name)}</b><br><small style="color:var(--muted)">${esc(p.unit||'')}</small></td><td>${esc(p.sku||'—')}<br><small style="color:var(--muted)">${esc(p.barcode||'')}</small></td><td>${esc(p.cat)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${boxc}</td><td>${taxById(p.taxId).rate}%</td><td>${st}</td><td style="white-space:nowrap"><button class="barbtn" style="padding:5px 9px" onclick="openProductModal('${p.id}')">✎</button><button class="barbtn" style="padding:5px 9px" onclick="adjustStock('${p.id}')">📦</button><button class="ci-del" onclick="deleteProduct('${p.id}')">🗑</button></td></tr>`}).join('')}</tbody>`;}
function openProductModal(id){if(!can('products')){toast('No permission to manage products',true);return}const p=id?PRODUCTS.find(x=>x.id===id):{name:'',sku:'',barcode:'',cat:'',price:'',cost:'',stock:'',taxId:'gst18',unit:'pc',piecesPerBox:1,boxPrice:0};modal(`<div class="modal-head"><h3>${id?'Edit':'Add'} Product</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Product Name *</label><input id="pName" value="${esc(p.name||'')}"></div><div class="row2"><div class="field"><label>Category</label><input id="pCat" value="${esc(p.cat||'')}" list="catList" oninput="updateSkuHint()"><datalist id="catList">${categories().filter(c=>c!=='All').map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Unit name</label><input id="pUnit" value="${esc(p.unit||'pc')}"></div></div><div class="row2"><div class="field"><label>SKU (blank = auto per category)</label><input id="pSku" value="${esc(p.sku||'')}" placeholder="${id?'':'auto'}"><div class="help" id="skuHint"></div></div><div class="field"><label>Barcode</label><div style="display:flex;gap:6px"><input id="pBar" value="${esc(p.barcode||'')}" placeholder="Scan or type"><button class="barbtn" style="flex:0;white-space:nowrap" onclick="openCamScan(c=>{document.getElementById('pBar').value=c;toast('Scanned: '+c)})">📷</button></div></div></div><div class="row3"><div class="field"><label>Cost (${S.currency})</label><input id="pCost" type="number" inputmode="decimal" value="${p.cost||0}"></div><div class="field"><label>Piece Price (${S.currency})</label><input id="pPrice" type="number" inputmode="decimal" value="${p.price||0}"></div><div class="field"><label>Stock (pieces)</label><input id="pStock" type="number" inputmode="decimal" value="${p.stock||0}"></div></div><div class="row3"><div class="field"><label>Pieces per Box</label><input id="pPpb" type="number" inputmode="decimal" min="1" value="${p.piecesPerBox||1}"></div><div class="field"><label>Box Price (0=auto)</label><input id="pBoxPrice" type="number" inputmode="decimal" value="${p.boxPrice||0}"></div><div class="field"><label>Tax Slab</label><select id="pTax">${TAXES.map(t=>`<option value="${t.id}" ${t.id===p.taxId?'selected':''}>${esc(t.name)} — ${t.rate}%</option>`).join('')}</select></div></div><p class="help">If "Pieces per Box" > 1, the cashier can sell a single piece OR a full box (box deducts that many pieces from stock).</p></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveProduct('${id||''}')">Save</button></div>`);updateSkuHint();}
function updateSkuHint(){const h=document.getElementById('skuHint');const sk=document.getElementById('pSku');if(!h||!sk)return;if(sk.value.trim()){h.textContent='';return}h.textContent='Will auto-assign: '+previewSku(document.getElementById('pCat').value);}
function saveProduct(id){const name=document.getElementById('pName').value.trim();if(!name){toast('Name is required',true);return}const cat=document.getElementById('pCat').value.trim()||'Uncategorized';let sku=document.getElementById('pSku').value.trim();if(!sku)sku=nextSku(cat);const data={name,sku,barcode:document.getElementById('pBar').value.trim(),cat,unit:document.getElementById('pUnit').value.trim()||'pc',cost:parseFloat(document.getElementById('pCost').value)||0,price:parseFloat(document.getElementById('pPrice').value)||0,stock:parseInt(document.getElementById('pStock').value)||0,piecesPerBox:Math.max(1,parseInt(document.getElementById('pPpb').value)||1),boxPrice:parseFloat(document.getElementById('pBoxPrice').value)||0,taxId:document.getElementById('pTax').value};if(id){Object.assign(PRODUCTS.find(p=>p.id===id),data)}else{PRODUCTS.push({id:uid('p'),...data})}save();closeModal();renderProductsTable();renderProducts();toast('Product saved — SKU '+sku);}
function deleteProduct(id){if(!confirm('Delete this product?'))return;PRODUCTS=PRODUCTS.filter(p=>p.id!==id);save();renderProductsTable();renderProducts();toast('Deleted')}
function adjustStock(id){const p=PRODUCTS.find(x=>x.id===id);modal(`<div class="modal-head"><h3>Adjust Stock — ${esc(p.name)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><p class="help" style="margin-bottom:10px">Current stock: <b>${p.stock}</b> pieces</p><div class="field"><label>Add (+) or remove (−) pieces</label><input id="adjQty" type="number" inputmode="decimal" placeholder="e.g. 50 or -10"></div>${(p.piecesPerBox||1)>1?`<div class="field"><label>…or add BOXES (×${p.piecesPerBox})</label><input id="adjBox" type="number" inputmode="decimal" placeholder="e.g. 5 boxes"></div>`:''}</div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="doAdjust('${id}')">Apply</button></div>`);}
function doAdjust(id){const p=PRODUCTS.find(x=>x.id===id);let q=parseInt(document.getElementById('adjQty').value)||0;const bx=document.getElementById('adjBox');if(bx&&parseInt(bx.value))q+=parseInt(bx.value)*(p.piecesPerBox||1);p.stock=Math.max(0,p.stock+q);save();closeModal();renderProductsTable();renderProducts();toast('Stock updated to '+p.stock)}

function renderRequests(){const list=REQUESTS.slice().sort((a,b)=>b.time-a.time);document.getElementById('view-requests').innerHTML=`<div class="toolbar"><b style="font-size:15px">✅ Item Requests</b><span class="pill">${REQUESTS.filter(r=>r.status==='pending').length} pending</span><span class="spacer"></span><button class="barbtn green" onclick="openRequestModal()">+ New Request</button></div><p class="help" style="margin:-6px 0 12px">Cashiers request stock or new items; the owner/manager approves. Approving a restock adds the quantity to inventory.</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Type</th><th>By</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>${list.length?list.map(r=>{const stt=r.status==='approved'?'<span class="tag green">Approved</span>':(r.status==='rejected'?'<span class="tag red">Rejected</span>':'<span class="tag amber">Pending</span>');const act=(r.status==='pending'&&can('approvals'))?`<button class="barbtn green" style="padding:5px 9px" onclick="approveRequest('${r.id}')">Approve</button> <button class="barbtn red" style="padding:5px 9px" onclick="rejectRequest('${r.id}')">Reject</button>`:'';return `<tr><td>${new Date(r.time).toLocaleString([], {dateStyle:'short',timeStyle:'short'})}</td><td><b>${esc(r.item)}</b></td><td>${r.qty}</td><td>${r.productId?'Restock':'New item'}</td><td>${esc(r.by||'')}</td><td>${esc(r.note||'')}</td><td>${stt}</td><td style="white-space:nowrap">${act}</td></tr>`}).join(''):'<tr><td colspan="8"><div class="empty">No requests yet.</div></td></tr>'}</tbody></table></div>`;}
function openRequestModal(){modal(`<div class="modal-head"><h3>New Item Request</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Type</label><select id="rqType" onchange="rqTypeChange()"><option value="restock">Restock existing product</option><option value="new">Request a new item</option></select></div><div class="field" id="rqProdWrap"><label>Product</label><select id="rqProd">${PRODUCTS.map(p=>`<option value="${p.id}">${esc(p.name)} (stock ${p.stock})</option>`).join('')}</select></div><div class="field" id="rqNameWrap" style="display:none"><label>Item name</label><input id="rqName" placeholder="e.g. Brand Y Cooking Oil"></div><div class="field"><label>Quantity needed</label><input id="rqQty" type="number" inputmode="decimal" value="1" min="1"></div><div class="field"><label>Note (optional)</label><input id="rqNote" placeholder="e.g. running low"></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="submitRequest()">Send for Approval</button></div>`);}
function rqTypeChange(){const t=document.getElementById('rqType').value;document.getElementById('rqProdWrap').style.display=t==='restock'?'block':'none';document.getElementById('rqNameWrap').style.display=t==='new'?'block':'none';}
function submitRequest(){const t=document.getElementById('rqType').value;const qty=parseInt(document.getElementById('rqQty').value)||1;const note=document.getElementById('rqNote').value.trim();let item,productId=null;if(t==='restock'){productId=document.getElementById('rqProd').value;const p=PRODUCTS.find(x=>x.id===productId);if(!p){toast('Pick a product',true);return}item=p.name}else{item=document.getElementById('rqName').value.trim();if(!item){toast('Enter the item name',true);return}}REQUESTS.unshift({id:uid('r'),time:Date.now(),item,qty,note,productId,by:currentUser?currentUser.name:'Admin',status:'pending'});save();closeModal();renderRequests();updateReqBadge();toast('Request sent to owner/manager');}
function approveRequest(id){if(!can('approvals')){toast('No permission',true);return}const r=REQUESTS.find(x=>x.id===id);if(!r)return;r.status='approved';r.decidedBy=currentUser?currentUser.name:'Admin';if(r.productId){const p=PRODUCTS.find(x=>x.id===r.productId);if(p)p.stock+=r.qty}save();renderRequests();updateReqBadge();renderProducts();toast('Approved'+(r.productId?' — stock added':''));}
function rejectRequest(id){if(!can('approvals')){toast('No permission',true);return}const r=REQUESTS.find(x=>x.id===id);if(!r)return;r.status='rejected';r.decidedBy=currentUser?currentUser.name:'Admin';save();renderRequests();updateReqBadge();toast('Rejected');}

function renderCustomers(){document.getElementById('view-customers').innerHTML=`<div class="toolbar"><b style="font-size:15px">🧑‍🤝‍🧑 Customers</b><input id="custSearch" placeholder="🔍 Search…" style="max-width:240px" oninput="renderCustomers2()"><span class="spacer"></span><button class="barbtn green" onclick="openCustomerModal()">+ Add Customer</button></div><div class="tablewrap"><table id="custTable"></table></div>`;renderCustomers2();}
function renderCustomers2(){const q=(document.getElementById('custSearch')?.value||'').toLowerCase();let list=CUSTOMERS.filter(c=>[c.name,c.phone,c.email].join(' ').toLowerCase().includes(q));document.getElementById('custTable').innerHTML=`<thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Points</th><th>Credit Owed</th><th>Purchases</th><th></th></tr></thead><tbody>${list.map(c=>{const purch=SALES.filter(s=>s.customer===c.id).length;return `<tr><td><b>${esc(c.name)}</b>${c.walkin?' <span class="tag gray">default</span>':''}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${c.points||0} pts</td><td>${c.credit>0?'<span class="tag amber">'+money(c.credit)+'</span>':'—'}</td><td>${purch}</td><td style="white-space:nowrap"><button class="barbtn" style="padding:5px 9px" onclick="openCustomerModal('${c.id}')">✎</button>${c.walkin?'':`<button class="ci-del" onclick="deleteCustomer('${c.id}')">🗑</button>`}</td></tr>`}).join('')}</tbody>`;}
function openCustomerModal(id){if(!can('customers')){toast('No permission',true);return}const c=id?CUSTOMERS.find(x=>x.id===id):{name:'',phone:'',email:'',credit:0,points:0};modal(`<div class="modal-head"><h3>${id?'Edit':'Add'} Customer</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Name *</label><input id="cName" value="${esc(c.name||'')}"></div><div class="row2"><div class="field"><label>Phone (WhatsApp)</label><input id="cPhone" inputmode="numeric" value="${esc(c.phone||'')}" placeholder="3001234567"></div><div class="field"><label>Email</label><input id="cEmail" value="${esc(c.email||'')}"></div></div><div class="row2"><div class="field"><label>Loyalty Points</label><input id="cPoints" type="number" inputmode="decimal" value="${c.points||0}"></div><div class="field"><label>Credit Owed (${S.currency})</label><input id="cCredit" type="number" inputmode="decimal" value="${c.credit||0}"></div></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveCustomer('${id||''}')">Save</button></div>`);}
