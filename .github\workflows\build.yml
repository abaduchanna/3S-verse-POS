name: Build 3S Verse POS Windows EXE

on:
  push:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install components
        run: npm install
      - name: Build the .exe
        run: npm run dist
      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: 3SVerse-POS-Windows-EXE
          path: |
            dist/*.exe
